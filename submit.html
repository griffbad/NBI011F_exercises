<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBI011F — Submit Annotation</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #070910;
    --surface:  #0e1118;
    --border:   #1e2535;
    --accent:   #4cc9f0;
    --accent2:  #f72585;
    --accent3:  #80ff72;
    --text:     #c8d6e5;
    --muted:    #4a5568;
    --success:  #80ff72;
    --error:    #f72585;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(76,201,240,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,201,240,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glowing orbs */
  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(76,201,240,0.06) 0%, transparent 70%);
    top: -200px; left: -200px;
    pointer-events: none;
    z-index: 0;
  }

  .orb2 {
    position: fixed;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(247,37,133,0.05) 0%, transparent 70%);
    bottom: -150px; right: -150px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
  }

  /* Header */
  .header {
    margin-bottom: 2.5rem;
    animation: fadeUp 0.6s ease both;
  }

  .course-tag {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .course-tag::before {
    content: '';
    display: inline-block;
    width: 20px; height: 1px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 0.5rem;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    animation: fadeUp 0.6s 0.1s ease both;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  /* Pipeline selector */
  .pipeline-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .pipeline-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1.75rem;
  }

  .pipeline-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
  }

  .pipeline-btn .day {
    font-size: 0.6rem;
    display: block;
    margin-bottom: 0.2rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .pipeline-btn .name {
    font-weight: 600;
    color: var(--text);
    font-size: 0.78rem;
  }

  .pipeline-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .pipeline-btn.active {
    border-color: var(--accent);
    background: rgba(76,201,240,0.07);
    color: var(--accent);
  }

  .pipeline-btn.active .name { color: var(--accent); }

  /* Form fields */
  .field { margin-bottom: 1.25rem; }

  label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  select, input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    appearance: none;
    transition: border-color 0.2s;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 0.85rem;
  }

  /* Drop zone */
  .dropzone {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
    position: relative;
  }

  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(76,201,240,0.04);
  }

  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    display: block;
  }

  .drop-text {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .drop-text strong {
    color: var(--accent);
    font-weight: 400;
  }

  .file-selected {
    margin-top: 0.75rem;
    font-size: 0.75rem;
    color: var(--accent3);
    display: none;
    align-items: center;
    gap: 0.4rem;
    justify-content: center;
  }

  .file-selected.visible { display: flex; }

  /* Submit button */
  .submit-btn {
    width: 100%;
    padding: 0.9rem;
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
    position: relative;
    overflow: hidden;
  }

  .submit-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-101%);
    transition: transform 0.3s ease;
    z-index: 0;
  }

  .submit-btn:hover::before { transform: translateX(0); }
  .submit-btn:hover { color: var(--bg); }
  .submit-btn span { position: relative; z-index: 1; }

  .submit-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Status */
  .status {
    margin-top: 1.25rem;
    padding: 0.9rem 1rem;
    border-radius: 8px;
    font-size: 0.78rem;
    line-height: 1.6;
    display: none;
    animation: fadeUp 0.3s ease both;
  }

  .status.visible { display: block; }

  .status.loading {
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--bg);
  }

  .status.success {
    border: 1px solid var(--success);
    color: var(--success);
    background: rgba(128,255,114,0.05);
  }

  .status.error {
    border: 1px solid var(--error);
    color: var(--error);
    background: rgba(247,37,133,0.05);
  }

  .status-icon { margin-right: 0.4rem; }

  /* Progress bar */
  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 0.75rem;
    overflow: hidden;
    display: none;
  }

  .progress-bar.visible { display: block; }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 2px;
  }

  /* Submissions list */
  .submissions-section {
    margin-top: 1.5rem;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .submissions-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .submissions-title {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .refresh-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: background 0.2s;
  }

  .refresh-btn:hover { background: rgba(76,201,240,0.1); }

  .submissions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.4rem;
  }

  .student-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    font-size: 0.65rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: border-color 0.2s;
  }

  .student-chip.submitted {
    border-color: rgba(128,255,114,0.4);
    color: var(--success);
  }

  .student-chip .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .student-chip.submitted .dot { background: var(--success); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border: 1px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }
</style>
</head>
<body>
<div class="orb2"></div>

<div class="container">

  <div class="header">
    <div class="course-tag">NBI011F · Neuroethology</div>
    <h1>Submit<br><span>Annotation</span></h1>
    <p class="subtitle">Upload your VIA JSON file to the course repository.<br>Select your pipeline and student name before submitting.</p>
  </div>

  <div class="card">

    <!-- Pipeline selector -->
    <div class="pipeline-label">Pipeline</div>
    <div class="pipeline-toggle">
      <button class="pipeline-btn active" onclick="setPipeline('bodyparts', this)">
        <span class="day">Day 2</span>
        <span class="name">Body Parts</span>
      </button>
      <button class="pipeline-btn" onclick="setPipeline('sleap', this)">
        <span class="day">Day 3</span>
        <span class="name">SLEAP Pose</span>
      </button>
    </div>

    <!-- Student name -->
    <div class="field">
      <label>Your Name</label>
      <div class="select-wrap">
        <select id="studentSelect">
          <option value="">— select your name —</option>
        </select>
      </div>
    </div>

    <!-- File drop zone -->
    <div class="field">
      <label>Annotation File (.json)</label>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".json">
        <span class="drop-icon">⬆</span>
        <div class="drop-text">
          Drop your JSON here or <strong>click to browse</strong><br>
          Exported from VIA → Annotations → Export as JSON
        </div>
        <div class="file-selected" id="fileSelected">
          <span>✓</span>
          <span id="fileName"></span>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitAnnotation()">
      <span>Submit to Repository</span>
    </button>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status" id="status"></div>

  </div>

  <!-- Submission tracker -->
  <div class="submissions-section">
    <div class="submissions-header">
      <span class="submissions-title">Class submissions</span>
      <button class="refresh-btn" onclick="loadSubmissions()">↻ refresh</button>
    </div>
    <div class="submissions-grid" id="submissionsGrid">
      <!-- populated by JS -->
    </div>
  </div>

</div>

<script>
// ── CONFIG — fill these in before deploying ───────────────────────────────────
const GITHUB_TOKEN = 'YOUR_GITHUB_TOKEN_HERE';
const REPO         = 'griffbad/NBI011F_exercises';
const BRANCH       = 'main';

const PIPELINES = {
  bodyparts: {
    folder:  'day_2/semantic_submissions',
    label:   'Body Parts (Day 2)',
  },
  sleap: {
    folder:  'day_3/sleap_submissions',
    label:   'SLEAP Pose (Day 3)',
  },
};

const STUDENTS = [
  'student_alice',
  'student_bob',
  'student_carol',
  'student_dave',
  'student_eve',
  'student_frank',
  'student_grace',
  'student_hank',
  'student_iris',
  'student_jack',
  'student_karen',
  'student_liam',
  'student_mia',
  'student_noah',
  'student_olivia',
  'student_pete',
  // ← replace all of these with your actual student folder names
];
// ─────────────────────────────────────────────────────────────────────────────

let currentPipeline = 'bodyparts';
let selectedFile    = null;

// Populate student dropdown
const sel = document.getElementById('studentSelect');
STUDENTS.forEach(name => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name.replace(/_/g, ' ');
  sel.appendChild(opt);
});

function setPipeline(key, btn) {
  currentPipeline = key;
  document.querySelectorAll('.pipeline-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadSubmissions();
}

// File input handling
const fileInput = document.getElementById('fileInput');
const dropzone  = document.getElementById('dropzone');

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) selectFile(e.target.files[0]);
});

dropzone.addEventListener('dragover', e => {
  e.preventDefault();
  dropzone.classList.add('drag-over');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
});

function selectFile(file) {
  if (!file.name.endsWith('.json')) {
    showStatus('error', '✗ Please select a .json file exported from VIA.');
    return;
  }
  selectedFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSelected').classList.add('visible');
  clearStatus();
}

// ── Submit ────────────────────────────────────────────────────────────────────
async function submitAnnotation() {
  const studentName = document.getElementById('studentSelect').value;

  if (!studentName) {
    showStatus('error', '✗ Please select your name.');
    return;
  }
  if (!selectedFile) {
    showStatus('error', '✗ Please select your annotation JSON file.');
    return;
  }

  // Validate JSON before uploading
  let parsed;
  try {
    const text = await selectedFile.text();
    parsed = JSON.parse(text);
  } catch {
    showStatus('error', '✗ File is not valid JSON. Make sure you exported from VIA correctly.');
    return;
  }

  const meta = parsed['_via_img_metadata'] || parsed;
  const nImgs = Object.keys(meta).length;
  const nRegions = Object.values(meta).reduce((s, v) => s + (v.regions||[]).length, 0);

  if (nRegions === 0) {
    showStatus('error', '✗ No annotations found in this file. Did you annotate before exporting?');
    return;
  }

  // Build target path
  const pipeline = PIPELINES[currentPipeline];
  const path     = `${pipeline.folder}/${studentName}.json`;
  const content  = btoa(unescape(encodeURIComponent(await selectedFile.text())));

  setProgress(true);
  document.getElementById('submitBtn').disabled = true;
  showStatus('loading', '<span class="spinner"></span> Submitting to repository...');

  try {
    // Check if file already exists (need SHA to update)
    const headers = {
      'Authorization': `token ${GITHUB_TOKEN}`,
      'Accept': 'application/vnd.github.v3+json',
    };

    let sha = undefined;
    const checkResp = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`,
      { headers }
    );
    if (checkResp.ok) {
      const existing = await checkResp.json();
      sha = existing.sha;
    }

    setProgress(60);

    // Commit the file
    const body = {
      message: `annotation: ${studentName} (${pipeline.label})`,
      content: content,
      branch:  BRANCH,
    };
    if (sha) body.sha = sha;

    const resp = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${path}`,
      { method: 'PUT', headers, body: JSON.stringify(body) }
    );

    setProgress(100);

    if (resp.ok) {
      const action = sha ? 'Updated' : 'Submitted';
      showStatus('success',
        `✓ ${action} successfully!\n\n` +
        `  Student : ${studentName.replace(/_/g, ' ')}\n` +
        `  Pipeline : ${pipeline.label}\n` +
        `  Images  : ${nImgs}\n` +
        `  Regions : ${nRegions}\n\n` +
        `Your annotation is now in the repository.`
      );
      setTimeout(loadSubmissions, 1500);
    } else {
      const err = await resp.json();
      throw new Error(err.message || `HTTP ${resp.status}`);
    }
  } catch (err) {
    showStatus('error', `✗ Submission failed: ${err.message}`);
    setProgress(false);
  }

  document.getElementById('submitBtn').disabled = false;
}

// ── Submission tracker ────────────────────────────────────────────────────────
async function loadSubmissions() {
  const grid     = document.getElementById('submissionsGrid');
  const pipeline = PIPELINES[currentPipeline];

  try {
    const resp = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${pipeline.folder}?ref=${BRANCH}`,
      { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );

    let submitted = new Set();
    if (resp.ok) {
      const files = await resp.json();
      if (Array.isArray(files)) {
        files.forEach(f => {
          const stem = f.name.replace('.json', '');
          submitted.add(stem);
        });
      }
    }

    grid.innerHTML = '';
    STUDENTS.forEach(name => {
      const chip = document.createElement('div');
      chip.className = 'student-chip' + (submitted.has(name) ? ' submitted' : '');
      chip.innerHTML = `
        <div class="dot"></div>
        <span>${name.replace(/_/g,' ')}</span>
      `;
      grid.appendChild(chip);
    });
  } catch {
    grid.innerHTML = '<span style="font-size:0.7rem;color:var(--muted)">Could not load submissions</span>';
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = `status ${type} visible`;
  el.style.whiteSpace = 'pre-wrap';
  el.innerHTML = msg;
}

function clearStatus() {
  const el = document.getElementById('status');
  el.className = 'status';
}

function setProgress(val) {
  const bar  = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  if (val === false) {
    bar.classList.remove('visible');
    fill.style.width = '0%';
  } else {
    bar.classList.add('visible');
    fill.style.width = val + '%';
  }
}

// Load on start
loadSubmissions();
</script>
</body>
</html>
