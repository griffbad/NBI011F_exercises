data_config:
  train_labels_path:
    - train.slp
  preprocessing:
    ensure_rgb: false
    ensure_grayscale: true
    scale: 0.5

model_config:
  backbone_config:
    unet:
      filters: 32
      max_stride: 16
  head_configs:
    single_instance:
      confmaps:
        sigma: 5.0

trainer_config:
  train_data_loader:
    batch_size: 1
    shuffle: true
    num_workers: 0
  val_data_loader:
    batch_size: 1
    shuffle: false
    num_workers: 0
  max_epochs: 100
  save_ckpt: true
  ckpt_dir: models
  run_name: single_instance